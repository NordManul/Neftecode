# Реестр источников значений. Каждый узел `settings.yaml` с полем `src` ссылается сюда полем `ref`.
#   kind: official   - нормативный документ (технический регламент, стандарт);
#         literature - публикация или справочник (не норматив), значение носит ориентировочный характер;
#         data       - оценка по данным проекта (файлы набора данных, техническое задание, уточнения заказчика,
#                      калибровка на обучающем периоде).
# Значений без источника в конфигурации нет: параметр, для которого источника нет, из системы удалён либо вычисляется
# по данным (см. docs/02_ОБОСНОВАНИЕ.md, раздел 16).

tr_ts_013_2011:
  kind: official
  short: "ТР ТС 013/2011"
  title: "ТР ТС 013/2011 «О требованиях к автомобильному и авиационному бензину, дизельному и судовому топливу, топливу для реактивных двигателей и мазуту»"
  url: "https://protect.gost.ru/tr/details/dfbf7ee2-f248-48c0-ad2b-202191e351bb"
  note: "массовая доля серы в дизельном топливе экологического класса 5 - не более 10 мг/кг"

gost_iso_3405_2013:
  kind: official
  short: "ГОСТ ISO 3405-2013"
  title: "ГОСТ ISO 3405-2013 (ISO 3405:2011) «Нефтепродукты. Определение фракционного состава при атмосферном давлении»"
  url: "http://docs.cntd.ru/document/1200108426"
  note: "метод для лёгких и средних дистиллятов с температурой конца кипения ниже 400 °C, ручной и автоматический аппараты. Прецизионность для дизельного топлива (группа 4), T95 = температура при 95 % об. отгона: автоматический аппарат (табл. 9, T в диапазоне 260-340 °C) повторяемость r = 0,015(T - 140), воспроизводимость R = 0,04227(T - 140); ручной аппарат (табл. 7) r = 0,41·ΔC/ΔV + 1,0, R = 1,33·ΔC/ΔV + 1,8, где ΔC/ΔV - наклон кривой разгонки, °C на % об. Различие двух результатов превышает r или R только в одном случае из двадцати. Регистрация: 0,5 °C для ручного и 0,1 °C для автоматического метода (разд. 12)"

gost_iso_20846_2016:
  kind: official
  short: "ГОСТ ISO 20846-2016"
  title: "ГОСТ ISO 20846-2016 (ISO 20846:2011) «Нефтепродукты жидкие. Определение содержания серы в автомобильных топливах. Метод ультрафиолетовой флуоресценции»"
  url: "https://meganorm.ru/Index2/1/4293738/4293738758.htm"
  note: "область применения 3-500 мг/кг; результат - среднее трёх определений, записывается с точностью 0,1 мг/кг при значении менее 60 мг/кг (разд. 10-11). Прецизионность для дизельного топлива, 3-60 мг/кг (табл. 2-3): повторяемость r = 0,0553X + 0,55, воспроизводимость R = 0,1120X + 1,12 (X - среднее результатов, мг/кг); на 10 мг/кг r = 1,1, R = 2,2 мг/кг. Различие двух результатов может превысить r или R только в одном случае из двадцати (r = 2,77σ)"

gost_iso_20884_2016:
  kind: official
  short: "ГОСТ ISO 20884-2016"
  title: "ГОСТ ISO 20884-2016 (ISO 20884:2011) «Нефтепродукты жидкие. Определение содержания серы в автомобильных топливах. Метод рентгенофлуоресцентной спектрометрии с дисперсией по длине волны»"
  url: "http://docs.cntd.ru/document/551515942"
  note: "область применения 5-500 мг/кг; результат записывается с точностью 0,1 мг/кг при значении 5-99 мг/кг (разд. 11). Прецизионность (табл. 4), 5-60 мг/кг: повторяемость r = 1,7 + 0,0248X, воспроизводимость R = 1,9 + 0,1201X (X - среднее результатов, мг/кг); на 10 мг/кг r = 1,9, R = 3,1 мг/кг"

gost_r_51947_2002:
  kind: official
  short: "ГОСТ Р 51947-2002"
  title: "ГОСТ Р 51947-2002 «Нефть и нефтепродукты. Определение серы методом энергодисперсионной рентгенофлуоресцентной спектрометрии»"
  url: "https://protect.gost.ru/gost/details/32ddba4b-28ac-43cf-adfe-3ec694783054"
  note: "область применения: массовая доля серы от 0,0150 % до 5,00 % (150-50000 мг/кг) в дизельном топливе, нефти, керосине, остатках, основах масел, реактивных топливах, неэтилированном бензине. Применима к сере в сырье (ЛИМС ГО т.1, Mass.Sulfur, медиана 0,95 %); сера продукта на уровне 10 мг/кг лежит ниже нижней границы, метод к ней не применим. Метод лаборатории в данных не указан"

gost_32511_2013:
  kind: official
  short: "ГОСТ 32511-2013"
  title: "ГОСТ 32511-2013 (EN 590:2009) «Топливо дизельное ЕВРО. Технические условия», таблица 1"
  url: "http://docs.cntd.ru/document/1200108413"
  note: "класс K5: сера не более 10,0 мг/кг (ISO 20846/20884); температура выкипания 95 % не выше 360 °C (ISO 3405); температура вспышки не ниже 55 °C (ISO 2719); плотность при 15 °C 820,0-845,0 кг/м3 (ISO 3675/12185); цетановое число не менее 51,0 (ГОСТ 32508)"

gost_32508_2013:
  kind: official
  short: "ГОСТ 32508-2013"
  title: "ГОСТ 32508-2013 «Топлива дизельные. Определение цетанового числа»"
  url: "http://docs.cntd.ru/document/1200108526"
  note: "метод определения цетанового числа, по которому нормируется показатель в ГОСТ 32511-2013"

puchkova_2020_tpu:
  kind: literature
  short: "Пучкова А.А., магистерская диссертация, ТПУ, 2020"
  title: "Пучкова А.А. Математическое моделирование процесса гидроочистки дистиллятного сырья. Магистерская диссертация. Национальный исследовательский Томский политехнический университет, 2020 (файл TPU932484)"
  file: "TPU932484.pdf"
  note: "прямая ссылка не установлена: работа получена файлом с именем по формату электронного архива ТПУ. Обзор литературы: для дизельного топлива с серой менее 10 ppm (Евро-5) необходима гидроочистка (с. 17, 24); температура процесса 250-420 °C, общее давление 2,5-6 МПа, парциальное давление водорода 1,5-3,7 МПа, концентрация водорода более 75 % об., кратность циркуляции 500-800 нм3/м3 (с. 39-42). Глава с кинетической моделью и константами скорости в предоставленном файле отсутствует (после с. 44 следует глава о ресурсоэффективности), поэтому значения энергии активации из неё не использованы"

akhmetov_2002:
  kind: literature
  short: "Ахметов С.А., Технология глубокой переработки нефти и газа, 2002"
  title: "Ахметов С.А. Технология глубокой переработки нефти и газа: учебное пособие для вузов. Уфа: Гилем, 2002. 672 с. ISBN 5-7501-0296-3"
  file: "Технология глубокой переработки нефти и газа.pdf"
  note: "с. 565: кажущаяся энергия активации гидрообессеривания на алюмокобальтмолибденовом катализаторе в интервале 340-425 °C составляет 46-88 кДж/моль; с. 568 (табл. 10.13): межрегенерационный период катализаторов гидроочистки 11 мес. (АКМ, АНМ, АНМС), 22-24 мес. (ГКД-202), общий срок службы 36-60 мес.; с. 571 (табл. 10.15): гидроочистка дизельного топлива 340-400 °C, 2,5-4,0 МПа, объёмная скорость 3,5-5,0 ч-1, выше 420 °C растут газообразование и коксование; с. 576-577 (табл. 10.16): установка ЛЧ-24-2000 - 2000 тыс. т/год, реактор 5,0 МПа и 360-400 °C, кратность ВСГ 250 м3/м3, выход стабильного гидрогенизата 97 % масс., расход водорода 0,4 % масс.; материальный баланс гидроочистки дизельного топлива: ДТ 96,9, отгон 1,3, газ 0,6, H2S 1,2 % масс. Типовой справочник; регламентом конкретной установки не является"

burondt_project_1228:
  kind: literature
  short: "Бюро НДТ, проект справочника (ProjectFile1228)"
  title: "Бюро НДТ. Проект информационно-технического справочника по наилучшим доступным технологиям (описание технологических процессов нефтепереработки), файл ProjectFile1228.pdf, 2017"
  url: "https://burondt.ru/files/ProjectFiles/ProjectFile1228.pdf"
  note: "разд. 2.12.4 (с. 104-107 файла): типовой режим гидроочистки дизельного топлива - парциальное давление водорода 3,0-4,0 МПа, температура на входе в реактор 350 °C в начале и 420 °C в конце работы (до регенерации катализатора), водород в циркулирующем газе 85 % об., объёмная скорость 3,5-4,0 ч-1; баланс: ДТ 96,9, отгон 1,3, газ 0,6, H2S 1,2 % масс. Проект справочника, не утверждённая редакция; название справочника в файле не указано"

fuel_2007_hds_activation_energy:
  kind: literature
  short: "Fuel: энергии активации HDS"
  title: "Estimation of activation energies during hydrodesulfurization of middle distillates (Fuel)"
  url: "https://www.sciencedirect.com/science/article/abs/pii/S0016236106003607"
  note: "по аннотации: энергии активации гидрообессеривания средних дистиллятов на CoMo-катализаторе 21,5-42,0 ккал/моль (около 90-176 кДж/моль) и зависят от содержания серы в сырье. Принятый в конфигурации диапазон 80-130 кДж/моль - допущение модели, частично перекрывающееся с литературным; для рабочего катализатора значение не подтверждено"

task_statement:
  kind: data
  short: "техническое задание"
  title: "Техническое задание для участников (файл ТЗ_нефтекод.docx)"
  note: "разд. 4 «Правило границ»: если для параметра нет подтверждённого рабочего диапазона, допускается консервативный модельный диапазон на основе истории или литературы, явно помеченный как допущение для эксперимента; минимальные жёсткие проверки: сера не более 10 мг/кг, доли компонентов блендинга 100 %, рекомендация в пределах явных ограничений, отказ при нехватке данных; в блендинге рассматривается только то, что подтверждается выданными материалами"

its_30_2021:
  kind: official
  short: "ИТС 30-2021 «Переработка нефти»"
  title: "Информационно-технический справочник по наилучшим доступным технологиям ИТС 30-2021 «Переработка нефти» (утв. приказом Росстандарта от 23.11.2021 N 2625)"
