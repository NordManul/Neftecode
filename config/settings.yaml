# =====================================================================
# Все значения системы в одном месте. Допущений без источника нет. Поле `src`:
#   GOST        - норматив (ГОСТ 32511-2013)
#   REQUIREMENT - нормативное требование к продукту
#   TASK        - требование или разрешение технического задания (файл ТЗ_нефтекод.docx) либо уточнение заказчика
#   DATA        - получено по данным (параметры моделей - только обучающий период)
#   LIT         - число взято из документа, указанного в `ref` (стандарт, справочник НДТ, диссертация, учебник)
# Поле `ref` - ссылка на источник в config/references.yaml. Пороги, которые можно вычислить по данным, в конфигурации
# не задаются: они находятся шагами prepare и calibrate (cache/thresholds.json, config/calibrated.json).
# =====================================================================
periods:
  train_end: "2025-01-01"
  test_end:  "2026-08-08"

files:
  avt: "*avt_tags*.csv"
  ho: "*242000*tags*.csv"
  lims: "*ЛИМС*.xlsx"
  pak: "*ПАК*.xlsx"
  tags: "*Теги*.xlsx"                 # исходный справочник (КИП/ЛА/ПАК/ВАК)
  tags_v2: "*теги*АВТ*24-2000*.xlsx"  # уточнённый справочник с физическими величинами (приоритетный)
  vak_v2: "*формулы_ВАК*.xlsx"        # уточнённые формулы ВАК (приоритетные)

data_quality:
  sentinel_values: {value: [307.0], src: DATA, note: "значение 307 - выброс (подтверждено заказчиком); код ошибки источника (D10 = 307 всегда; 307 встречается в 60+ тегах)", ref: [data_project, customer_clarification]}
  pak_sulfur_valid: {value: [0.05, 19.9], src: DATA, note: "показания не выше 0.05 - отказ (54 точки), 19.9-20.0 - насыщение шкалы (152 точки)", ref: data_project}
  q21_sulfur_valid: {value: [0.05, 24.65], src: DATA, note: "Q21 - сера на выходе гидроочистки, ppm (заказчик); показания не выше 0.05 (включая отрицательные) - отказ (98 точек), от 24.65 - плато насыщения шкалы (5.4 тыс. точек), между 24.25 и 24.65 значений нет", ref: [data_project, customer_clarification]}
  lims_dedup_minutes: {value: 5, src: DATA, note: "дубли выгрузки с разницей в секундах", ref: data_project}
  lims_ranges:                      # область применения метода: нижняя граница не включается, верхняя включается
    value:
      "Mg.Sulfur": [0, 500]         # ГОСТ ISO 20846 (3-500) и ГОСТ ISO 20884 (5-500 мг/кг): верх области методов
      "Mass.Sulfur": [0.015, 5.0]   # ГОСТ Р 51947-2002: 0,0150-5,00 % масс.
      "IBP.T": [0, 400]             # ГОСТ ISO 3405: начало кипения выше 0 °C, конец кипения ниже 400 °C
      "50%.T": [0, 400]
      "90%.T": [0, 400]
      "95%.T": [0, 400]
      "EBP.T": [0, 400]
    src: LIT
    ref: [gost_iso_20846_2016, gost_iso_20884_2016, gost_r_51947_2002, gost_iso_3405_2013]
    note: "границы - области применения методов испытаний; записи вне области считаются ошибкой ввода (нули - заполнитель пропуска); для остальных показателей ЛИМС диапазонов в материалах проекта нет, записи не отбраковываются"

spec:
  sulfur_max_mgkg: {value: 10.0, src: REQUIREMENT, ref: [tr_ts_013_2011, gost_32511_2013, puchkova_2020_tpu]}
  t95_max_c: {value: 360.0, src: GOST, ref: gost_32511_2013}
  flash_min_c: {value: 55.0, src: GOST, ref: gost_32511_2013}
  # Нормы по видам продукта (уточнение заказчика): ДТ с гидроочистки (анализы ЛИМС ГО т.2) - плотность 820-845,
  # цетановое число не нормируется; товарное ДТ летнее (ниже) и зимнее (`winter`) - нормы для проверки смеси,
  # выбор - `product_grade`.
  d15_range: {value: [820.0, 845.0], src: GOST, note: "ДТ с гидроочистки и летнее товарное", ref: [gost_32511_2013, customer_clarification]}
  cetane_min: {value: 51.0, src: GOST, note: "летнее товарное ДТ; для ДТ с гидроочистки цетановое число не нормируется", ref: [gost_32511_2013, gost_32508_2013, customer_clarification]}
  product_grade: {value: summer, src: TASK, note: "сорт товарного ДТ, по которому проверяется смесь: summer (летнее) или winter (зимнее); выбор пользователя, время года в постановке не указано", ref: customer_clarification}
  winter:
    d15_range: {value: [800.0, 845.0], src: GOST, note: "зимнее товарное ДТ (ГОСТ 32511-2013, таблица 3, классы 0 и 1)", ref: [gost_32511_2013, customer_clarification]}
    cetane_min: {value: 49.0, src: GOST, note: "зимнее товарное ДТ (ГОСТ 32511-2013, таблица 3, классы 0 и 1)", ref: [gost_32511_2013, gost_32508_2013, customer_clarification]}
  risk_alpha: {value: 0.05, src: LIT, note: "допустимая вероятность превышения нормы (шанс-ограничение): уровень «один случай из двадцати», которым стандарты методов испытаний определяют повторяемость и воспроизводимость", ref: [gost_iso_3405_2013, gost_iso_20846_2016, gost_iso_20884_2016]}

sensor_fusion:
  max_sigma_for_decision: {value: 1.12, src: LIT, note: "оценка серы не должна быть неопределённее воспроизводимости лабораторного метода: R = 1.9 + 0.1201·X при X = 10 мг/кг (ГОСТ ISO 20884, таблица 4), σ = R/2.77; для ГОСТ ISO 20846 σ = 0.81 (метод лаборатории не указан, взято большее значение)", ref: [gost_iso_20884_2016, gost_iso_20846_2016]}
  forecast_horizon_h: {value: 4, src: DATA, note: "эффект изменения Т5 проявляется за 2-8 ч (событийный анализ)", ref: data_project}

decision_vars:                      # модельный диапазон управляющих воздействий (ТЗ, разд. 4, «Правило границ»)
  T5:  {unit: "°C",   desc: "24-2000, Р-201: температура ГСС на выходе (жёсткость гидроочистки)", grid: [-3, -2, -1, 0, 1, 2, 3],
        src: TASK, note: "диапазон ±3 °C по истории: 77 % четырёхчасовых изменений T5 в рабочем режиме обучающего периода не выходят за него, шаг 1 °C (медиана изменения 1.4 °C)", ref: [task_statement, data_project]}
  F9:  {unit: "т/ч",  desc: "24-2000: расход сырья на установку (массовый)", grid_rel: [-0.10, -0.05, 0.0],
        src: TASK, note: "снижение загрузки до 10 %: 93 % четырёхчасовых изменений F9 не выходят за ±10 %, шаг 5 % (медиана изменения 1.9 %); рост загрузки не рассматривается (правило «не навреди» по сере)", ref: [task_statement, data_project]}
  F32: {unit: "т/ч",  desc: "АВТ: расход фр. 240-290 °C с установки (отбор ДТ из К-2)", grid: [-5, -2.5, 0, 2.5, 5],
        src: TASK, note: "диапазон ±5 т/ч по истории: 93.5 % четырёхчасовых изменений F32 не выходят за него, шаг 2.5 т/ч (медиана изменения 0.8 т/ч)", ref: [task_statement, data_project]}

reliability:
  catalyst_cycle_c: {value: {start: 350, end: 420}, src: LIT, note: "температура на входе в реактор в начале цикла и в конце (до регенерации катализатора), типовой режим гидроочистки дизельного топлива", ref: [its_30_2021, burondt_project_1228]}
  monitored_tags:
    ho: [T5, T6, T11, P3, P13, P8, F9, F2, GOR]
    avt: [T55, T33, P22, T20, F65, F32]

kinetics:
  ea_kj_mol: {value: [46, 88], src: LIT, note: "кажущаяся энергия активации гидрообессеривания на АКМ-катализаторе в интервале 340-425 °C (Ахметов, с. 565); нижняя граница задаёт «среднюю», верхняя - «сильную» оценку чувствительности серы к температуре (соответствие - выбор модели). Жилина: 81 кДж/моль для Co-Mo катализатора при 250-350 °C и объёмной скорости 2 ч-1, выше 350 °C процесс переходит во внешнедиффузионную область, где кажущаяся энергия ниже. В аннотации статьи Fuel приведены более высокие значения (90-176 кДж/моль), для промышленной практики не проверенные", ref: [akhmetov_2002, zhilina_2022_ugntu, fuel_2007_hds_activation_energy]}
  feed_sulfur_ppm: {value: 9500, src: DATA, note: "медиана ЛИМС ГО т.1 Mass.Sulfur 0.95 % масс. (132 анализа, диапазон 0.20-1.06 %); метод определения в данных не указан, значение лежит внутри области ГОСТ Р 51947-2002 (0,0150-5,00 %)", ref: [data_project, gost_r_51947_2002]}

process:
  feed_density_t_m3: {value: 0.85, src: DATA, note: "F9/F26 = 0.85 (r=1.00); ЛИМС ГО т.1 D15 медиана 847", ref: data_project}
  ht_yield: {value: 0.968, src: DATA, note: "медиана (F19 - W10)/F9 в установившемся режиме обучающего периода: F19 по данным - масса потока гидрогенизата в стабилизатор К-201 (справочник называет его «бензином»), W10 - бензиновый отгон (1,3 % от сырья). Справочно: выход стабильного гидрогенизата на ЛЧ-24-2000 - 97 % масс. (Ахметов, табл. 10.16), в балансе ИТС 30-2021 (табл. 2.36) указано 96,6 при сумме статей 100,1 вместо 100,4", ref: [data_project, akhmetov_2002, its_30_2021]}

blending:
  # Компоненты смешения (керосин, газойль) и присадки в материалах проекта не описаны: их свойства, запасы, эффекты
  # присадок и величина партии неизвестны, поэтому по умолчанию товарное ДТ равно ГО ДТ и проверяется по нормам сорта.
  # Для сценарного расчёта заполните `scenario_components` и `additives` паспортными данными (формат записей - в
  # tests/blending_data.py) и при необходимости `share_step`, `batch_t`, `rule_margins`, `main_stock_t`,
  # `main_share_range`, `main_defaults`.
  main_component: "ГО ДТ (24-2000)"
  mode: {value: product_only, src: TASK, note: "product_only - товарное ДТ = ГО ДТ (100 %); scenario - подбор рецептуры (нужны данные компонентов); manual - расчёт заданной рецептуры", ref: task_statement}
  scenario_components: {}
  additives: {}
