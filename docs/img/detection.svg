<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="Сигнал о риске и результат анализа ЛИМС" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto"><title>Сигнал о риске и результат анализа ЛИМС</title><style>
