.fg-dot{fill:var(--accent,#1f6feb);fill-opacity:.85;stroke:var(--card,#fff);stroke-width:1}
.fg-ref{stroke:var(--warn,#b7791f);stroke-width:1.2;stroke-dasharray:4 3;fill:none}
