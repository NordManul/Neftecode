<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" role="img" aria-label="Архитектура: агенты обмениваются сообщениями через шину" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto"><title>Архитектура: агенты обмениваются сообщениями через шину</title><style>
.fg-bg{fill:var(--card,#fff)} .fg-axis{stroke:var(--border,#d5dbe3);stroke-width:1;fill:none}
.fg-grid{stroke:var(--border,#e6eaf0);stroke-width:1;stroke-dasharray:2 3}
.fg-t{fill:var(--muted,#5b6b7c);font:11px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.fg-tt{fill:var(--text,#16202b);font:600 12px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.fg-line{stroke:var(--accent,#1f6feb);stroke-width:1.4;fill:none;stroke-linejoin:round}
.fg-band{fill:var(--accent,#1f6feb);fill-opacity:.16;stroke:none}
.fg-limit{stroke:var(--bad,#c62828);stroke-width:1.2;stroke-dasharray:5 4;fill:none}
.fg-lab{fill:var(--muted,#5b6b7c);fill-opacity:.75} .fg-labx{fill:var(--bad,#c62828);fill-opacity:.9}
.fg-none{fill:var(--ok,#1a7f4b)} .fg-action{fill:var(--accent,#1f6feb)} .fg-refuse{fill:var(--warn,#b7791f)}
.fg-observe{fill:var(--border,#c9d1da)}
.fg-bar{fill:var(--accent,#1f6feb)} .fg-bar2{fill:var(--ok,#1a7f4b)} .fg-bar3{fill:var(--muted,#8a97a6)}
.fg-diag{stroke:var(--muted,#8a97a6);stroke-width:1;stroke-dasharray:4 4;fill:none}
.fg-dot{fill:var(--accent,#1f6feb);fill-opacity:.85;stroke:var(--card,#fff);stroke-width:1}
.fg-ref{stroke:var(--warn,#b7791f);stroke-width:1.2;stroke-dasharray:4 3;fill:none}
</style><rect class="fg-bg" x="0" y="0" width="1100" height="300" rx="6"/><style>.ar-box{fill:var(--card,#fff);stroke:var(--accent,#1f6feb);stroke-width:1.4}.ar-orc{fill:var(--accent,#1f6feb);stroke:none}.ar-src{fill:var(--card,#fff);stroke:var(--muted,#8a97a6);stroke-width:1.2;stroke-dasharray:4 3}.ar-bus{fill:var(--accent,#1f6feb);fill-opacity:.13;stroke:var(--accent,#1f6feb);stroke-width:1}.ar-ln{stroke:var(--muted,#8a97a6);stroke-width:1.4;fill:none;marker-end:url(#ar-arrow)}.ar-h{fill:var(--text,#16202b);font:600 13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.ar-w{fill:#fff;font:600 13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.ar-s{fill:var(--muted,#5b6b7c);font:11px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.ar-sw{fill:#fff;font:11px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}</style><defs><marker id="ar-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted,#8a97a6)"/></marker></defs><rect class="ar-box" x="160" y="34" width="158" height="62" rx="8"/><text class="ar-h" x="239.0" y="56" text-anchor="middle">DataAgent</text><text class="ar-s" x="239.0" y="74" text-anchor="middle">снимок состояния,</text><text class="ar-s" x="239.0" y="88" text-anchor="middle">возраст анализов, флаги</text><line class="ar-ln" x1="239.0" y1="96" x2="239.0" y2="130" style="marker-end:none"/><rect class="ar-box" x="332" y="34" width="158" height="62" rx="8"/><text class="ar-h" x="411.0" y="56" text-anchor="middle">QualityAgent</text><text class="ar-s" x="411.0" y="74" text-anchor="middle">оценка серы и T95,</text><text class="ar-s" x="411.0" y="88" text-anchor="middle">риск нарушения нормы</text><line class="ar-ln" x1="411.0" y1="96" x2="411.0" y2="130" style="marker-end:none"/><rect class="ar-box" x="504" y="34" width="158" height="62" rx="8"/><text class="ar-h" x="583.0" y="56" text-anchor="middle">ReliabilityAgent</text><text class="ar-s" x="583.0" y="74" text-anchor="middle">индекс тяжести режима,</text><text class="ar-s" x="583.0" y="88" text-anchor="middle">границы модели</text><line class="ar-ln" x1="583.0" y1="96" x2="583.0" y2="130" style="marker-end:none"/><rect class="ar-box" x="676" y="34" width="158" height="62" rx="8"/><text class="ar-h" x="755.0" y="56" text-anchor="middle">OptimizationAgent</text><text class="ar-s" x="755.0" y="74" text-anchor="middle">105 вариантов, отбор,</text><text class="ar-s" x="755.0" y="88" text-anchor="middle">порядок предпочтения</text><line class="ar-ln" x1="755.0" y1="96" x2="755.0" y2="130" style="marker-end:none"/><rect class="ar-box" x="848" y="34" width="158" height="62" rx="8"/><text class="ar-h" x="927.0" y="56" text-anchor="middle">BlendingAgent</text><text class="ar-s" x="927.0" y="74" text-anchor="middle">доли компонентов,</text><text class="ar-s" x="927.0" y="88" text-anchor="middle">присадки, нормы смеси</text><line class="ar-ln" x1="927.0" y1="96" x2="927.0" y2="130" style="marker-end:none"/><rect class="ar-bus" x="150" y="130" width="866" height="30" rx="6"/><text class="ar-h" x="583.0" y="149" text-anchor="middle">шина сообщений: запрос, ответ, журнал</text><line class="ar-ln" x1="583.0" y1="194" x2="583.0" y2="160" style="marker-end:none"/><rect class="ar-orc" x="413.0" y="194" width="340" height="66" rx="8"/><text class="ar-w" x="583.0" y="218" text-anchor="middle">Orchestrator</text><text class="ar-sw" x="583.0" y="237" text-anchor="middle">выбор варианта, независимая повторная проверка,</text><text class="ar-sw" x="583.0" y="251" text-anchor="middle">объяснение либо отказ</text><rect class="ar-src" x="8" y="34" width="132" height="62" rx="8"/><text class="ar-h" x="74" y="56" text-anchor="middle">Данные</text><text class="ar-s" x="74" y="74" text-anchor="middle">телеметрия, ЛИМС,</text><text class="ar-s" x="74" y="88" text-anchor="middle">ПАК, справочник</text><line class="ar-ln" x1="140" y1="65.0" x2="158" y2="65.0"/><line class="ar-ln" x1="753.0" y1="227.0" x2="791.0" y2="227.0"/><rect class="ar-box" x="793.0" y="194" width="200" height="66" rx="8"/><text class="ar-h" x="893.0" y="218" text-anchor="middle">Карточка оператора</text><text class="ar-s" x="893.0" y="237" text-anchor="middle">8 блоков и журнал шины</text><text class="ar-s" x="893.0" y="251" text-anchor="middle">либо отказ с причиной</text></svg>