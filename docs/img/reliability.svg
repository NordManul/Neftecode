<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img" aria-label="Расчётная вероятность и частота превышений" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto"><title>Расчётная вероятность и частота превышений</title><style>
